version: '3.9'

services:
  agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    env_file:
      - ./services/agent/.env
    volumes:
      - ./services/agent:/app
    depends_on:
      - ml

  ml:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
    env_file:
      - ./services/ml/.env
    volumes:
      - ./services/ml:/app

volumes: {}
